# WatchMagic radar puck: HLK-LD2450 on an ESP32-S3 dev board (WROOM, two USB-C).
# Sends up to 3 people's x/y (mm, radar frame) to Home Assistant.
# Secrets go in esphome/secrets.yaml (never committed).
#
# Wiring (LD2450 4-pin header → ESP32-S3 board):
#   5V  → 5Vin    GND → GND
#   TX  → GPIO18  (ESP RX)
#   RX  → GPIO17  (ESP TX)
# UNVERIFIED: not yet compiled here (`esphome config watchmagic-radar.yaml` to check).

substitutions:
  room: meghna_room

esphome:
  name: watchmagic-radar-meghna
  friendly_name: WatchMagic Radar Meghna

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: ld2450_uart
  rx_pin: GPIO18
  tx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: ld2450_uart

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: Presence

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: Target count
    still_target_count:
      name: Still target count
    moving_target_count:
      name: Moving target count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      speed:
        name: Target-1 Speed
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      speed:
        name: Target-2 Speed
    target_3:
      x:
        name: Target-3 X
      y:
        name: Target-3 Y
      speed:
        name: Target-3 Speed
