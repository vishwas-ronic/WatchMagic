name: WatchMagic
options:
  bundleIdPrefix: ai.ronic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: G93232N59R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WatchMagicKit:
    path: Packages/WatchMagicKit

targets:
  WatchMagic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSApp
    dependencies:
      - package: WatchMagicKit
      - target: WatchMagic Watch App
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: WatchMagic
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: WatchMagic talks to your Home Assistant server on the local network.
        NSCameraUsageDescription: WatchMagic uses the camera and LiDAR to place your devices in the room.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ronic.watchmagic
        TARGETED_DEVICE_FAMILY: "1"

  WatchMagic Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    dependencies:
      - package: WatchMagicKit
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: WatchMagic
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.ronic.watchmagic
        WKBackgroundModes: [physical-therapy]
        NSMotionUsageDescription: WatchMagic reads wrist motion to know where you are pointing and to detect flick gestures.
        NSLocationWhenInUseUsageDescription: WatchMagic uses the compass heading to know which direction you are pointing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ronic.watchmagic.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  WatchMagic:
    build:
      targets:
        WatchMagic: all
    run:
      config: Debug
  WatchMagic Watch App:
    build:
      targets:
        WatchMagic Watch App: all
    run:
      config: Debug
